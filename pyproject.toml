[project]
name = "hitl-agent"
version = "0.1.0"
description = "Human-in-the-Loop tool-using agent (LangGraph + FastAPI + Postgres)"
requires-python = ">=3.12"
# Runtime deps are pinned in requirements.txt (the reproducible install surface).
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
