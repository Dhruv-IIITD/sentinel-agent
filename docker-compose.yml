# Default `docker compose up` runs the durable core: Postgres + the API + the console.
# The voice workers need LiveKit/Deepgram/Groq keys, so they sit behind a profile and
# would only crash-loop without them:
#
#   docker compose up                      # db + api + console  -> http://localhost:8000/ui
#   docker compose --profile voice up      # ...plus the support agent and the approval-call agent

x-voice-env: &voice-env
  BACKEND_URL: http://api:8000
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  TTS_PROVIDER: ${TTS_PROVIDER:-deepgram}
  TURN_DETECTION: ${TURN_DETECTION:-vad}
  APPROVER_PIN: ${APPROVER_PIN:-}
  APPROVER_AGENT_NAME: ${APPROVER_AGENT_NAME:-approval-agent}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hitl
      POSTGRES_PASSWORD: hitl
      POSTGRES_DB: hitl_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitl -d hitl_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hitl:hitl@db:5432/hitl_agent
      CHECKPOINT_BACKEND: auto
      # The agent runs on Groq by default; set LLM_PROVIDER=anthropic to switch.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Needed for the console's "Start a voice call" and "Call a human" buttons,
      # which ask the API to mint a LiveKit token / dispatch the approval call.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_SIP_TRUNK_ID: ${LIVEKIT_SIP_TRUNK_ID:-}
      APPROVER_PHONE: ${APPROVER_PHONE:-}
      APPROVER_AGENT_NAME: ${APPROVER_AGENT_NAME:-approval-agent}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-hitl-agent}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5
    # Create tables + seed on boot, then serve. (Swap create-tables for
    # `alembic upgrade head` once migrations are committed.)
    command: >
      sh -c "python scripts/init_db.py &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Takes the calls: STT -> LLM -> TTS, with tools that route through the API's risk gate.
  voice-agent:
    build:
      context: .
      dockerfile: voice/Dockerfile
    profiles: ["voice"]
    depends_on:
      api:
        condition: service_healthy
    environment: *voice-env
    command: ["python", "agent.py", "start"]
    restart: unless-stopped

  # Phones a human when policy gates an action. Dispatched on demand (explicit
  # agent_name), so it never joins a customer's call.
  approval-agent:
    build:
      context: .
      dockerfile: voice/Dockerfile
    profiles: ["voice"]
    depends_on:
      api:
        condition: service_healthy
    environment: *voice-env
    command: ["python", "approver_agent.py", "start"]
    restart: unless-stopped

volumes:
  pgdata:
